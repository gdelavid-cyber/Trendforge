name: Observability & Ecosystem Hourly Cron

on:
  schedule:
    # Run every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Trendly Observability & Autonomous Ecosystem Pulse
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET || '74af8419e8b10a88d9e93a0ff7ee0ec54cbac71f16e584f7217c87331e5a99a6' }}
        run: |
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            "https://trendly-platform-chi.vercel.app/api/cron/observability")
          
          body=$(echo "$response" | sed -e '$d')
          status=$(echo "$response" | tail -n1 | cut -d':' -f2)

          echo "Response Status: $status"
          echo "Response Body: $body"

          if [ "$status" -ne 200 ]; then
            echo "Error: Cron ping failed with status $status"
            exit 1
          fi
